name: Update WCL Snapshot (US / Americas)

on:
  workflow_dispatch:
    inputs:
      pages:
        description: Pages per spec board (WCL caps at 20; ~100 players each)
        required: false
        default: "20"
      delay:
        description: Delay between live API requests in milliseconds
        required: false
        default: "1200"
      brackets:
        description: Keystone levels for extra unfiltered boards (empty = spec only)
        required: false
        default: "10-30"
  schedule:
    # Daily at 10:15 UTC — keeps Americas snapshot fresh without hammering the API
    - cron: "15 10 * * *"

permissions:
  contents: write

jobs:
  update-us:
    uses: ./.github/workflows/update-region.yml
    with:
      region: us
      pages: ${{ github.event.inputs.pages || '20' }}
      delay: ${{ github.event.inputs.delay || '1200' }}
      brackets: ${{ github.event.inputs.brackets || '10-30' }}
    secrets:
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
